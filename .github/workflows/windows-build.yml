name: Windows build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish the zip as a GitHub Release"
        type: boolean
        default: false
  push:
    branches:
      - claude/confident-carson-vxwibu

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\pmvgen.exe dist\
          Copy-Item README.md dist\
          $sha = "${{ github.sha }}".Substring(0, 7)
          Compress-Archive -Path dist\* -DestinationPath "pmvgen-windows-x64-$sha.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmvgen-windows-x64
          path: pmvgen-windows-x64-*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build-windows
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pmvgen-windows-x64
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="v${VERSION}-windows-${SHA}"
          gh release create "$TAG" dist/*.zip \
            --target "${{ github.sha }}" \
            --title "PMV Generator ${VERSION} (Windows x64)" \
            --notes "Windows x64 build of PMV Generator ${VERSION}, built from commit ${{ github.sha }}. Needs ffmpeg.exe and ffprobe.exe next to pmvgen.exe (or \`winget install Gyan.FFmpeg\`)." \
            --prerelease
          echo "Release: $TAG" >> "$GITHUB_STEP_SUMMARY"
